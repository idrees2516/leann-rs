[package]
name = "leann-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for LEANN"

[[bin]]
name = "leann"
path = "src/main.rs"

[dependencies]
leann-core = { path = "../leann-core" }
leann-embedder = { path = "../leann-embedder" }
leann-ingest = { path = "../leann-ingest" }
leann-chat = { path = "../leann-chat" }
leann-guard = { path = "../leann-guard" }
leann-visual = { path = "../leann-visual" }
leann-server = { path = "../leann-server" }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
