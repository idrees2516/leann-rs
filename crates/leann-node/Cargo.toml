[package]
name = "leann-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node.js / TypeScript bindings for LEANN via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
leann-core = { path = "../leann-core" }
leann-embedder = { path = "../leann-embedder" }
leann-ingest = { path = "../leann-ingest" }
leann-chat = { path = "../leann-chat" }
leann-guard = { path = "../leann-guard" }
serde_json = { workspace = true }
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[build-dependencies]
napi-build = "2"
