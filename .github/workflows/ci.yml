name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true
      - name: Test
        run: cargo test --workspace
      - name: Build release CLI
        run: cargo build --release -p leann-cli
      - name: Self-ingest smoke test
        env:
          LEANN_EMBEDDER: local
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          INDEX=/tmp/smoke/self.leann
          $GITHUB_WORKSPACE/target/release/leann add --index $INDEX \
            $GITHUB_WORKSPACE/crates/leann-core/src || true
          $GITHUB_WORKSPACE/target/release/leann search --index $INDEX "product quantization" --k 3
          $GITHUB_WORKSPACE/target/release/leann visual build --index $INDEX --output /tmp/smoke/m.gif --format gif
          $GITHUB_WORKSPACE/target/release/leann visual query --index $INDEX "pq codec" --video /tmp/smoke/m.gif --k 2
