[workspace]
resolver = "2"
members = [
    "crates/leann-core",
    "crates/leann-embedder",
    "crates/leann-ingest",
    "crates/leann-chat",
    "crates/leann-guard",
    "crates/leann-node",
    "crates/leann-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/idrees2516/leann-rs"
keywords = ["vector-search", "rag", "ann", "embeddings", "leann"]
categories = ["database-implementations", "science"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
thiserror = "2"
rand = "0.8"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "thin"
